<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sand Table - Controller</title>
    <style>
        :root {
            --color-background: #f2f2f7;
            --color-surface: #ffffff;
            --color-primary: #007aff;
            --color-text: #1c1c1e;
            --color-text-secondary: #8e8e93;
            --color-border: rgba(0,0,0,0.08);
            --color-separator: rgba(0,0,0,0.06);
            --color-danger: #ff3b30;
            --color-shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --color-shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-card: 14px;
            --radius-button: 10px;
            --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        /* Prevent zooming, text selection, tap highlights, and touch scrolling/dragging */
        html, body {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        /* --- Base Styles --- */
        body {
            font-family: var(--font-main);
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* --- Global Navigation --- */
        .main-nav {
            z-index: 2000;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            transition: all 0.3s;
        }

        .main-nav a {
            text-decoration: none;
            color: var(--color-text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: color 0.2s;
            flex: 1;
        }

        .main-nav a:hover, .main-nav a.active {
            color: var(--color-primary);
        }

        .main-nav .icon {
            width: 22px;
            height: 22px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-nav svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        /* Mobile: Bottom Nav */
        @media (max-width: 768px) {
            .main-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                box-shadow: var(--color-shadow-sm), var(--color-shadow-md);
                padding: 12px 0;
                border-radius: 0;
            }
            .main-nav a span:not(.icon) { display: none; }
            .main-nav .icon { margin-bottom: 0; width: 26px; height: 26px; }
            body { padding-bottom: 90px !important; }

            /* Shrink Live View for Mobile */
            .live-view-card {
                padding: 16px;
                margin-bottom: 20px;
            }
            #viewCanvas {
                width: 250px;
                height: 250px;
                margin: 0 auto;
                display: block;
            }
            .joystick-container {
                width: 200px;
                height: 200px;
            }
            .joystick-stick {
                width: 60px;
                height: 60px;
            }
        }

        /* Desktop: Top Nav */
        @media (min-width: 769px) {
            .main-nav {
                position: sticky;
                top: 0;
                box-shadow: var(--color-shadow-sm), var(--color-shadow-md);
                padding: 10px 0;
            }
        }

        .main-content {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* --- Buttons --- */
        .btn-action {
            background-color: var(--color-primary);
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: var(--radius-button);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--color-shadow-sm);
        }

        .btn-action:hover {
            opacity: 0.85;
            transform: translateY(-1px);
            box-shadow: var(--color-shadow-sm), var(--color-shadow-md);
        }

        .btn-action:active {
            transform: translateY(0);
            opacity: 1;
        }

        .btn-danger {
            background-color: var(--color-danger);
        }

        /* --- Live View --- */
        .live-view-card {
            background: var(--color-surface);
            padding: 20px;
            border-radius: var(--radius-card);
            box-shadow: var(--color-shadow-sm), var(--color-shadow-md);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .live-view-card h3 {
            margin: 0 0 16px 0;
            font-size: 17px;
            font-weight: 600;
            color: var(--color-text);
        }

        canvas {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            background: #ffffff;
            border-radius: var(--radius-button);
            display: block;
            box-shadow: inset 0 0 0 1px var(--color-border);
        }

        .position-display {
            margin-top: 15px;
            font-size: 13px;
            color: var(--color-text-secondary);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* --- Joystick --- */
        .joystick-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 40px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: var(--color-shadow-sm), var(--color-shadow-md);
        }

        .joystick-stick {
            position: absolute;
            width: 80px;
            height: 80px;
            background: var(--color-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            transition: transform 0.1s;
        }

        .center-button-container {
            display: flex;
            justify-content: center;
        }

        /* --- Motion Warning --- */
        .motion-warning {
            background: var(--color-danger);
            color: #ffffff;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            border-radius: var(--radius-card);
            box-shadow: var(--color-shadow-sm), var(--color-shadow-md);
        }

        .motion-warning-title {
            margin-bottom: 12px;
            font-size: 15px;
        }

        .motion-warning-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .motion-warning-actions .btn-action {
            padding: 10px 20px;
            font-size: 14px;
            background: #ffffff;
            color: var(--color-danger);
        }

        /* --- Popup --- */
        #sent-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: var(--color-primary);
            color: #ffffff;
            padding: 24px 48px;
            border-radius: var(--radius-card);
            font-size: 1.5rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            z-index: 3000;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0, 122, 255, 0.4);
        }
        #sent-popup.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* --- Loading Overlay --- */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(242, 242, 247, 0.8);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--color-border);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .loader-text {
            font-weight: 600;
            color: var(--color-text);
            font-size: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-content" id="mainContent">
        <nav class="main-nav">
            <a href="/" id="nav-designs"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg></span><span>Designs</span></a>

            <a href="/led_controls" id="nav-leds"><span class="icon"><svg viewBox="0 0 24 24"><path d="M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z"/></svg></span><span>LEDs</span></a>

        </nav>

        <div id="sent-popup">SENT</div>

        <div id="motion-warning" class="motion-warning" style="display:none;">
            <div class="motion-warning-title">End design before controlling</div>
            <div class="motion-warning-actions">
                <button class="btn-action" onclick="quitDesign()">Quit Design</button>
            </div>
        </div>

        <div id="loadingOverlay">
            <div class="loader-spinner"></div>
            <div class="loader-text" id="loaderStatus">Centering...</div>
        </div>

        <div class="live-view-card">
            <h3>Live View</h3>
            <canvas id="viewCanvas" width="400" height="400"></canvas>
            <div class="position-display">
                THETA: <span id="val-theta">0.00</span> | RHO: <span id="val-rho">0.00</span>
            </div>
        </div>

        <div class="joystick-container" id="joyContainer">
            <div class="joystick-stick" id="joyStick"></div>
        </div>

        <div class="center-button-container">
            <button id="centerBtn" class="btn-action" onclick="resetToCenter()" style="width: 100%; max-width: 250px;">Center Arm</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('viewCanvas');
        const ctx = canvas.getContext('2d');
        const stick = document.getElementById('joyStick');
        const container = document.getElementById('joyContainer');

        let ballPos = { theta: 0, rho: 0 };
        let visualPos = { theta: 0, rho: 0 }; // Smoothed position for drawing
        let isDragging = false;
        let isCentering = false; // Block inputs during reset
        let joyPos = { x: 0, y: 0 };
        let moveInterval = null;

        // --- DRAWING ---
        function drawBall() {
            // Smoothly interpolate visualPos toward ballPos
            const ease = 0.15; // Animation smoothness (lower = smoother/slower)

            // Handle theta wrap-around for smoother rotation interpolation
            let diffTheta = ballPos.theta - visualPos.theta;
            while (diffTheta > Math.PI) diffTheta -= Math.PI * 2;
            while (diffTheta < -Math.PI) diffTheta += Math.PI * 2;

            visualPos.theta += diffTheta * ease;
            visualPos.rho += (ballPos.rho - visualPos.rho) * ease;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid lines
            ctx.strokeStyle = 'rgba(128, 128, 128, 0.2)';
            ctx.beginPath();
            for(let r=0.2; r<=1.0; r+=0.2) {
                ctx.arc(200, 200, r * 180, 0, Math.PI * 2);
            }
            ctx.stroke();

            // Ball position calculation (using visualPos for smoothness)
            const r = visualPos.rho * 180;
            const x = 200 + r * Math.cos(visualPos.theta);
            const y = 200 + r * Math.sin(visualPos.theta);

            // Draw shadow/path
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fill();

            // Draw Ball
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--color-primary');
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            document.getElementById('val-theta').textContent = ballPos.theta.toFixed(2);
            document.getElementById('val-rho').textContent = ballPos.rho.toFixed(2);

            requestAnimationFrame(drawBall);
        }

        let hasInitialized = false;
        async function updateStatus() {
            try {
                const res = await fetch('/status_full');
                const data = await res.json();
                const warning = document.getElementById('motion-warning');
                const joy = document.getElementById('joyContainer');
                const centerBtn = document.getElementById('centerBtn');

                // Simulator sync: Update ball position from server
                if (data.position && (data.playing || !hasInitialized)) {
                    ballPos.theta = data.position.theta;
                    ballPos.rho = data.position.rho;

                    if (!hasInitialized) {
                        visualPos.theta = ballPos.theta;
                        visualPos.rho = ballPos.rho;
                        hasInitialized = true;
                    }
                }

                if (data.playing || data.is_waiting) {
                    warning.style.display = 'block';
                    joy.style.display = 'none';
                    centerBtn.style.display = 'none';
                } else {
                    warning.style.display = 'none';
                    joy.style.display = 'flex';
                    centerBtn.style.display = 'block';
                }
            } catch(e) {}
        }

        async function quitDesign() {
            if(!confirm("Quit current design and clear queue?")) return;
            await sendCommand('CLEAR');
            updateStatus();
        }

        // --- JOYSTICK LOGIC ---
        function handleMove(e) {
            if (!isDragging || isCentering) return;

            const rect = container.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            let clientX = (e.clientX || (e.touches && e.touches[0].clientX));
            let clientY = (e.clientY || (e.touches && e.touches[0].clientY));

            let dx = clientX - rect.left - centerX;
            let dy = clientY - rect.top - centerY;

            const maxRadius = 80;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > maxRadius) {
                dx *= maxRadius / dist;
                dy *= maxRadius / dist;
            }

            joyPos.x = dx;
            joyPos.y = dy;
            stick.style.transform = `translate(${dx}px, ${dy}px)`;
        }

        let lastSentTheta = 0;

        function startMoveLoop() {
            if (moveInterval || isCentering) return;
            moveInterval = setInterval(() => {
                if (Math.abs(joyPos.x) < 5 && Math.abs(joyPos.y) < 5) return;
                const stepScale = 0.015; // Smooth incremental movement
                let curX = ballPos.rho * Math.cos(ballPos.theta);
                let curY = ballPos.rho * Math.sin(ballPos.theta);
                curX += (joyPos.x / 80) * stepScale;
                curY += (joyPos.y / 80) * stepScale;
                let newRho = Math.sqrt(curX*curX + curY*curY);
                let rawTheta = Math.atan2(curY, curX);

                if (newRho > 1.0) newRho = 1.0;
                if (newRho < 0.005) {
                    newRho = 0;
                    rawTheta = 0;
                }

                // Unwrap theta to prevent jumpy 360-degree motor rewinds
                let diff = rawTheta - (lastSentTheta % (Math.PI * 2));
                if (diff < -Math.PI) diff += Math.PI * 2;
                if (diff > Math.PI) diff -= Math.PI * 2;
                let newTheta = lastSentTheta + diff;
                lastSentTheta = newTheta;

                ballPos.rho = newRho;
                ballPos.theta = newTheta;
                sendMove();
            }, 60); // 16 Hz move update rate for fluid control
        }

        function stopMoveLoop() {
            clearInterval(moveInterval);
            moveInterval = null;
            joyPos = { x: 0, y: 0 };
            stick.style.transform = `translate(0,0)`;
        }

        async function sendMove() {
            try {
                await fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theta: ballPos.theta, rho: ballPos.rho })
                });
            } catch(e) {}
        }

        async function sendCommand(cmd) {
            try {
                const res = await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                if (data.success) {
                    showPopup(cmd);
                    updateStatus();
                }
            } catch(e) {
                console.error(e);
            }
        }

        function resetToCenter() {
            if (isCentering) return;
            isCentering = true;
            document.getElementById('loadingOverlay').style.display = 'flex';

            ballPos.rho = 0;
            ballPos.theta = 0;
            sendMove();

            const centerInterval = setInterval(() => {
                if (visualPos.rho > 0.01) {
                    visualPos.rho -= 0.05;
                    if(visualPos.rho < 0) visualPos.rho = 0;
                } else {
                    visualPos.rho = 0;
                    visualPos.theta = 0;
                    clearInterval(centerInterval);
                    isCentering = false;
                    document.getElementById('loadingOverlay').style.display = 'none';
                    showPopup("Centered");
                }
            }, 50);
        }

        // --- EVENT LISTENERS ---
        container.addEventListener('mousedown', () => { if(!isCentering) { isDragging = true; startMoveLoop(); } });
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', () => { isDragging = false; stopMoveLoop(); });

        container.addEventListener('touchstart', (e) => { if(!isCentering) { isDragging = true; startMoveLoop(); e.preventDefault(); } }, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', () => { isDragging = false; stopMoveLoop(); });

        function showPopup(text) {
            let p = document.getElementById('sent-popup');
            p.textContent = text; p.classList.add('active');
            setTimeout(() => p.classList.remove('active'), 800);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            const navMap = { '/': 'nav-designs', '/controller': 'nav-controller', '/sketch': 'nav-sketch', '/AI_builder': 'nav-ai', '/led_controls': 'nav-leds', '/terminal': 'nav-terminal', '/settings': 'nav-settings' };
            const activeId = navMap[path] || 'nav-controller';
            const el = document.getElementById(activeId);
            if (el) el.classList.add('active');

            // Auto-resume motors and set starting speed to 0.5
            fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: 'RESUME' }) });
            fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: 'SPEED 0.5' }) });

            drawBall();
            updateStatus();
            setInterval(updateStatus, 3000);
        });
    </script>
</body>
</html>
