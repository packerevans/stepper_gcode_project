<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi System Console</title>
    <style>
        /* --- Root Variables (iOS-style Light Mode) --- */
        :root {
            --color-primary: #007aff;
            --color-primary-light: rgba(0, 122, 255, 0.08);
            --color-bg: #f2f2f7;
            --color-surface: #ffffff;
            --color-text: #1c1c1e;
            --color-text-secondary: #8e8e93;
            --color-border: rgba(0, 0, 0, 0.08);
            --color-separator: rgba(0, 0, 0, 0.06);
            --color-danger: #ff3b30;
            --color-success: #34c759;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --color-terminal-bg: #fafafa;
        }

        /* --- Base Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Global Navigation --- */
        .main-nav {
            z-index: 2000;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            border-bottom: 0.5px solid var(--color-separator);
        }

        .main-nav a {
            text-decoration: none;
            color: var(--color-text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.6rem;
            font-weight: 500;
            transition: color 0.2s;
            flex: 1;
            padding: 4px 0;
            border: none;
            letter-spacing: 0.3px;
        }

        .main-nav a:hover, .main-nav a.active {
            color: var(--color-primary);
            background: none;
            border: none;
        }

        .main-nav .icon { width: 22px; height: 22px; margin-bottom: 2px; }
        .main-nav svg { width: 100%; height: 100%; fill: currentColor; }

        /* Mobile: Bottom Nav */
        @media (max-width: 768px) {
            .main-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                border-top: 0.5px solid var(--color-separator);
                border-bottom: none;
                padding: 8px 0 env(safe-area-inset-bottom, 8px);
            }
            .main-nav a span:not(.icon) { display: none; }
            .main-nav .icon { width: 26px; height: 26px; margin-bottom: 0; }
            body { padding-bottom: 80px; }
        }

        /* Desktop: Top Nav */
        @media (min-width: 769px) {
            .main-nav {
                position: sticky;
                top: 0;
            }
        }

        .main-content {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* --- System Action Buttons --- */
        .system-actions {
            display: grid;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
            grid-template-columns: repeat(3, 1fr);
        }

        @media (max-width: 768px) {
            .system-actions {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .btn-action {
            background: var(--color-surface);
            color: var(--color-text);
            border: none;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            font-family: inherit;
        }

        .btn-action:hover {
            background: var(--color-primary-light);
            color: var(--color-primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-action.btn-primary {
            background: var(--color-primary);
            color: #ffffff;
        }

        .btn-action.btn-primary:hover {
            background: #0066d6;
            color: #ffffff;
        }

        .btn-danger {
            color: var(--color-danger);
        }

        .btn-danger:hover {
            background: rgba(255, 59, 48, 0.08);
            color: var(--color-danger);
        }

        @media (max-width: 768px) {
            .btn-action {
                padding: 12px 8px;
                font-size: 0.75rem;
            }
        }

        /* --- Terminal Log Styling --- */
        #log {
            background: var(--color-terminal-bg);
            color: var(--color-text);
            padding: 20px;
            border: none;
            border-radius: var(--radius);
            height: 50vh;
            overflow-y: scroll;
            white-space: pre-wrap;
            font-family: 'SF Mono', 'Monaco', 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            margin-top: 20px;
            box-shadow: var(--shadow-sm);
            scrollbar-width: thin;
            scrollbar-color: var(--color-border) var(--color-bg);
        }

        #log::-webkit-scrollbar {
            width: 8px;
        }

        #log::-webkit-scrollbar-track {
            background: transparent;
        }

        #log::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 4px;
        }

        /* --- Terminal Input --- */
        .terminal-input-wrapper {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }

        #terminalInput {
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text);
            padding: 14px 16px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            width: 100%;
            flex: 1;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #terminalInput:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        #terminalInput::placeholder {
            color: var(--color-text-secondary);
        }

        .terminal-input-wrapper .btn-action {
            flex-shrink: 0;
            min-width: 80px;
        }

        /* --- Password Screen --- */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        #loginScreen.hidden {
            display: none;
        }

        #loginBox {
            padding: 40px;
            background: var(--color-surface);
            border: none;
            border-radius: var(--radius);
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow-lg);
        }

        #loginBox h2 {
            margin-bottom: 30px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        #loginBox img {
            margin: 0 auto 20px auto;
            display: block;
        }

        #passwordInput {
            padding: 14px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            width: 100%;
            margin-bottom: 16px;
            font-size: 1.1rem;
            background: var(--color-bg);
            color: var(--color-text);
            text-align: center;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #passwordInput:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        #passwordInput::placeholder {
            color: var(--color-text-secondary);
        }

        #errorMsg {
            color: var(--color-danger);
            margin-top: 16px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* --- Flash Messages --- */
        #flashMessages {
            min-height: 0;
            margin-bottom: 10px;
        }

        .flash-message {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        .flash-message.info {
            background: rgba(52, 199, 89, 0.1);
            color: var(--color-success);
            border: 1px solid rgba(52, 199, 89, 0.2);
        }

        .flash-message.error {
            background: rgba(255, 59, 48, 0.1);
            color: var(--color-danger);
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        /* --- Calibration Modal --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 4000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background: var(--color-surface);
            border: none;
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            padding: 32px;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--color-text-secondary);
            font-weight: 700;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s, color 0.2s;
            padding: 0;
            line-height: 1;
        }

        .modal-close:hover {
            background: var(--color-border);
            color: var(--color-text);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        .cal-section {
            margin-bottom: 30px;
        }

        .cal-section:last-of-type {
            margin-bottom: 20px;
        }

        .cal-label {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
            color: var(--color-text-secondary);
            letter-spacing: 0.5px;
        }

        .cal-buttons {
            display: flex;
            gap: 12px;
        }

        .cal-button {
            background: var(--color-surface);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            flex: 1;
            padding: 16px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cal-button:active {
            transform: scale(0.95);
            background: var(--color-primary-light);
        }

        .cal-button-save {
            background: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            width: 100%;
            padding: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
        }

        .cal-button-save:hover {
            background: #0066d6;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .cal-button-save:active {
            transform: scale(0.97);
        }

        /* --- Arrow Icons (SVG) --- */
        .arrow-left {
            width: 20px;
            height: 20px;
        }

        .arrow-right {
            width: 20px;
            height: 20px;
        }
    </style>
</head>

    <div class="main-content" id="mainContent">
        <div class="system-actions">
            <button id="updateBtn" class="btn-action" onclick="sendCommand('/update_firmware', 'Update Firmware')">Update FW</button>
            <button id="pullBtn" class="btn-action" onclick="sendCommand('/pull', 'Git Pull')">Git Pull</button>
            <button id="calMenuBtn" class="btn-action" onclick="openCalModal()">Manual Cal</button>
            <button id="resetAppBtn" class="btn-action btn-danger" onclick="sendCommand('/restart_app', 'Reset App')">Reset App</button>
            <button id="rebootBtn" class="btn-action btn-danger" onclick="sendCommand('/reboot', 'Reboot')">Reboot</button>
            <button id="shutdownBtn" class="btn-action btn-danger" onclick="sendCommand('/shutdown', 'Shutdown')">Shutdown</button>
        </div>

        <div id="flashMessages"></div>

        <div id="log">Awaiting command line output...</div>

        <div class="terminal-input-wrapper">
            <input type="text" id="terminalInput" placeholder="Enter command (e.g., CALIBRATE, SPEED 1.5, 0,255,0)" onkeydown="if(event.key==='Enter') sendManualCommand()">
            <button class="btn-action btn-primary" onclick="sendManualCommand()">Send</button>
        </div>
    </div>

    <!-- Calibration Modal -->
    <div id="calModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button onclick="closeCalModal()" class="modal-close">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <h2 class="modal-title">Manual Calibration</h2>

            <div class="cal-section">
                <p class="cal-label">BASE POSITION</p>
                <div class="cal-buttons">
                    <button onmousedown="startStepping('BASE_L')" onmouseup="stopStepping()" ontouchstart="startStepping('BASE_L')" ontouchend="stopStepping()" class="cal-button">
                        <svg class="arrow-left" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                        </svg>
                    </button>
                    <button onmousedown="startStepping('BASE_R')" onmouseup="stopStepping()" ontouchstart="startStepping('BASE_R')" ontouchend="stopStepping()" class="cal-button">
                        <svg class="arrow-right" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="cal-section">
                <p class="cal-label">ARM POSITION</p>
                <div class="cal-buttons">
                    <button onmousedown="startStepping('ARM_L')" onmouseup="stopStepping()" ontouchstart="startStepping('ARM_L')" ontouchend="stopStepping()" class="cal-button">
                        <svg class="arrow-left" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                        </svg>
                    </button>
                    <button onmousedown="startStepping('ARM_R')" onmouseup="stopStepping()" ontouchstart="startStepping('ARM_R')" ontouchend="stopStepping()" class="cal-button">
                        <svg class="arrow-right" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button onclick="sendCalCmd('SET_ZERO')" class="cal-button-save">Save 0,0 Position</button>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen">
        <div id="loginBox">
            <h2>Access Required</h2>
            <img src="/static/terminal.png" alt="Console" width="200" height="200">
            <input type="password" id="passwordInput" placeholder="Access Code" onkeydown="handleKey(event)">
            <button class="btn-action btn-primary" style="width: 100%;" onclick="checkPassword()">Unlock</button>
            <p id="errorMsg"></p>
        </div>
    </div>

    <script>
        const AUTH_KEY = 'pi_console_authenticated';
        const CORRECT_PASSWORD = "2025";
        const MAIN_CONTENT = document.getElementById("mainContent");
        const LOGIN_SCREEN = document.getElementById("loginScreen");
        const TERMINAL_INPUT = document.getElementById('terminalInput');

        let commandHistory = JSON.parse(localStorage.getItem('terminal_history') || '[]');
        let historyIndex = commandHistory.length;

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();

            const path = window.location.pathname;
            const navMap = {
                '/': 'nav-designs',
                '/designs': 'nav-designs',
                '/controller': 'nav-controller',
                '/sketch': 'nav-sketch',
                '/AI_builder': 'nav-ai',
                '/led_controls': 'nav-leds',
                '/terminal': 'nav-terminal',
                '/settings': 'nav-settings'
            };
            document.querySelectorAll('.main-nav a').forEach(a => a.classList.remove('active'));
            const activeId = navMap[path];
            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) el.classList.add('active');
            }

            setInterval(fetchLogs, 2000);
            fetchLogs();

            TERMINAL_INPUT.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (historyIndex > 0) {
                        historyIndex--;
                        TERMINAL_INPUT.value = commandHistory[historyIndex];
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (historyIndex < commandHistory.length - 1) {
                        historyIndex++;
                        TERMINAL_INPUT.value = commandHistory[historyIndex];
                    } else {
                        historyIndex = commandHistory.length;
                        TERMINAL_INPUT.value = '';
                    }
                }
            });
        });

        function checkAuthStatus() {
            if (localStorage.getItem(AUTH_KEY) === 'true') {
                LOGIN_SCREEN.classList.add("hidden");
                MAIN_CONTENT.style.opacity = "1";
                MAIN_CONTENT.style.pointerEvents = "auto";
            } else {
                LOGIN_SCREEN.classList.remove("hidden");
                MAIN_CONTENT.style.opacity = "0.1";
                MAIN_CONTENT.style.pointerEvents = "none";
            }
        }

        function handleKey(event) {
            if (event.key === 'Enter') checkPassword();
        }

        async function checkPassword() {
            const input = document.getElementById("passwordInput").value;
            if (input === CORRECT_PASSWORD) {
                localStorage.setItem(AUTH_KEY, 'true');
                checkAuthStatus();
            } else {
                document.getElementById("errorMsg").innerText = "Access Denied. Try again.";
                document.getElementById("passwordInput").value = '';
            }
        }

        async function flashMessage(message, category = 'info') {
            const msgDiv = document.getElementById("flashMessages");
            const messageClass = category === 'info' ? 'info' : 'error';
            msgDiv.innerHTML = `<div class="flash-message ${messageClass}">${message}</div>`;
            setTimeout(() => {
                msgDiv.innerHTML = '';
            }, 5000);
        }

        async function sendCommand(url, commandName) {
            if (localStorage.getItem(AUTH_KEY) !== 'true') return checkAuthStatus();
            if (!window.confirm(`Run '${commandName}'?`)) return;
            flashMessage(`Executing ${commandName}...`);
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                flashMessage(
                    data.success ? `Success: ${data.message}` : `Failed: ${data.message}`,
                    data.success ? 'info' : 'error'
                );
            } catch (error) {
                flashMessage(`Network error: ${error.message}`, 'error');
            }
        }

        async function sendManualCommand() {
            const input = document.getElementById("terminalInput");
            const cmd = input.value.trim();
            if (!cmd || localStorage.getItem(AUTH_KEY) !== 'true') return;
            try {
                const res = await fetch('/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                if (data.success) {
                    if (commandHistory[commandHistory.length - 1] !== cmd) {
                        commandHistory.push(cmd);
                        localStorage.setItem('terminal_history', JSON.stringify(commandHistory));
                    }
                    historyIndex = commandHistory.length;
                    input.value = '';
                } else {
                    flashMessage("Failed to send command.", "error");
                }
            } catch (error) {
                flashMessage("Error sending command.", "error");
            }
        }

        async function fetchLogs() {
            if (localStorage.getItem(AUTH_KEY) !== 'true') return;
            try {
                const res = await fetch("/terminal/logs");
                const data = await res.json();
                const logElement = document.getElementById("log");
                const isScrolledToBottom = logElement.scrollHeight - logElement.clientHeight <= logElement.scrollTop + 10;
                logElement.textContent = data.join("\n");
                if (isScrolledToBottom) {
                    logElement.scrollTop = logElement.scrollHeight;
                }
            } catch (e) {}
        }

        /* --- CALIBRATION LOGIC --- */
        let stepInterval = null;

        function openCalModal() {
            document.getElementById('calModal').classList.remove('hidden');
        }

        function closeCalModal() {
            document.getElementById('calModal').classList.add('hidden');
            stopStepping();
        }

        async function sendCalCmd(cmd) {
            await fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            });
        }

        function startStepping(dir) {
            if(stepInterval) return;
            sendCalCmd(`STEP_${dir}`);
            stepInterval = setInterval(() => {
                sendCalCmd(`STEP_${dir}`);
            }, 100);
        }

        function stopStepping() {
            if(stepInterval) {
                clearInterval(stepInterval);
                stepInterval = null;
            }
        }
    </script>
</body>
</html>
