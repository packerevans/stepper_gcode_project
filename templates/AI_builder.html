<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sand AI Builder</title>
    
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/static/icons/icon-512.png">

    <style>
        :root {
            --primary: #007aff;
            --secondary: #5ac8fa;
            --bg: #f2f2f7;
            --panel: #ffffff;
            --text: #1c1c1e;
            --accent: #007aff;
            --danger: #ff3b30;
            --btn-text: #1c1c1e;
            --color-border: rgba(0, 0, 0, 0.08);
            --color-text-secondary: #8e8e93;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
        }
        body[data-theme='dark'] {
            --bg: #000000; --panel: #1c1c1e; --text: #ffffff; --btn-text: #fff;
            --color-border: rgba(255,255,255,0.1); --color-text-secondary: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Navigation --- */
        .main-nav {
            z-index: 2000;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            border-bottom: 0.5px solid var(--color-border);
        }
        body[data-theme='dark'] .main-nav { background: rgba(28,28,30,0.92); }

        .main-nav a {
            text-decoration: none;
            color: var(--color-text-secondary);
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.6rem; font-weight: 500;
            transition: color 0.2s; flex: 1; padding: 4px 0;
            border: none; letter-spacing: 0.3px;
        }

        .main-nav a:hover, .main-nav a.active { color: var(--primary); background: none !important; border: none; }
        body[data-theme='dark'] .main-nav a:hover, body[data-theme='dark'] .main-nav a.active { color: var(--primary); background: none !important; border: none; }

        .main-nav .icon { width: 22px; height: 22px; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; }
        .main-nav svg { width: 100%; height: 100%; fill: currentColor; }

        @media (max-width: 768px) {
            .main-nav {
                position: fixed !important; bottom: 0 !important; top: auto !important; left: 0; right: 0;
                border-top: 0.5px solid var(--color-border); border-bottom: none;
                padding: 8px 0 env(safe-area-inset-bottom, 8px);
            }
            body[data-theme='dark'] .main-nav { border-top: 0.5px solid rgba(255,255,255,0.1); }
            .main-nav a span:not(.icon) { display: none; }
            .main-nav .icon { margin-bottom: 0; width: 26px; height: 26px; }
            body { padding-bottom: 80px !important; height: auto !important; overflow: auto !important; }
        }

        @media (min-width: 769px) { .main-nav { position: sticky; top: 0; } }

        /* --- Header --- */
        .header-nav {
            display: grid; grid-template-columns: 1fr auto 1fr;
            align-items: center; padding: 12px 20px;
            background: var(--panel); color: var(--text);
            border-bottom: 0.5px solid var(--color-border); position: relative;
        }
        body[data-theme='dark'] .header-nav { background: var(--panel); }

        .header-title { grid-column: 2; text-align: center; font-size: 1.05rem; font-weight: 600; margin: 0; white-space: nowrap; }

        .theme-toggle {
            grid-column: 3; justify-self: end;
            background: none; border: none; cursor: pointer; color: var(--color-text-secondary);
            width: 32px; height: 32px; padding: 4px;
            display: flex; align-items: center; justify-content: center;
            z-index: 2500; border-radius: 50%;
        }
        .theme-toggle:active { background: rgba(0,0,0,0.05); }
        body[data-theme='dark'] .theme-toggle { color: #8e8e93; }
        .theme-toggle svg { width: 100%; height: 100%; fill: currentColor; }
        .theme-toggle .moon { display: none; }
        body[data-theme='dark'] .theme-toggle .sun { display: none; }
        body[data-theme='dark'] .theme-toggle .moon { display: block; }

        .app-container {
            display: flex; flex-direction: column; height: 100%; width: 100%;
            padding: 12px; box-sizing: border-box; gap: 12px; overflow-y: auto;
        }
        @media (min-width: 768px) {
            .app-container { flex-direction: row; overflow: hidden; justify-content: center; max-width: 1200px; margin: 0 auto; }
            .preview-panel { flex: 2; border-radius: var(--radius); background: var(--panel); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: var(--shadow-sm); }
            .controls-panel { flex: 1; max-width: 400px; border-radius: var(--radius); background: var(--panel); padding: 20px; overflow-y: auto; box-shadow: var(--shadow-sm); }
        }
        @media (max-width: 767px) {
            .preview-panel { width: 100%; aspect-ratio: 1/1; border-radius: var(--radius); background: var(--panel); flex-shrink: 0; position: relative; box-shadow: var(--shadow-sm); }
            .controls-panel { flex: 1; border-radius: var(--radius); background: var(--panel); padding: 16px; box-shadow: var(--shadow-sm); }
        }

        .canvas-wrapper {
            position: relative; width: 92vmin; height: 92vmin;
            max-width: 92%; max-height: 92%; aspect-ratio: 1 / 1; margin: auto;
            border-radius: 50% !important;
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff; touch-action: none; overflow: hidden;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }
        body[data-theme='dark'] .canvas-wrapper { background: #1c1c1e; border-color: rgba(255,255,255,0.1); }
        canvas { display: block; width: 100%; height: 100%; border-radius: 50% !important; }

        h2 { margin: 0 0 15px 0; font-size: 1rem; color: var(--text); text-align: center; font-weight: 600; }
        body[data-theme='dark'] h2 { color: #ffffff; }
        .btn-group { display: flex; gap: 6px; margin-bottom: 10px; }

        button {
            background-color: var(--panel); color: var(--text);
            border: none; padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer;
            font-size: 13px; transition: all 0.2s; font-weight: 600;
            display: flex; align-items: center; justify-content: center; flex: 1;
            box-shadow: var(--shadow-sm);
        }
        body[data-theme='dark'] button { background-color: #2c2c2e; color: #ffffff; }
        button:hover { background-color: rgba(0,122,255,0.06); }
        body[data-theme='dark'] button:hover { background-color: #3a3a3c; }
        button.active { background-color: var(--primary); color: #ffffff; box-shadow: none; }
        body[data-theme='dark'] button.active { background-color: var(--primary); color: #ffffff; }
        button.action { background-color: var(--primary); color: #ffffff; }
        body[data-theme='dark'] button.action { background-color: var(--primary); color: #ffffff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .slider-row { margin-bottom: 12px; background: rgba(0,0,0,0.03); padding: 10px 12px; border-radius: var(--radius-sm); }
        .slider-header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; font-weight: 600; color: var(--color-text-secondary); }
        input[type="range"] { width: 100%; accent-color: var(--primary); }

        #progressSlider { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(0,0,0,0.1); outline: none; }
        #progressSlider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; box-shadow: 0 2px 6px rgba(0,122,255,0.3); }

        #status-toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--panel); color: var(--text); padding: 12px 24px; border-radius: 12px;
            font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 3000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12); font-weight: 500;
        }
        .success { background: #34c759 !important; color: #fff !important; }
        .error { background: #ff3b30 !important; color: #fff !important; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 6px; color: var(--color-text-secondary); letter-spacing: 0.3px; }
        textarea, input[type="text"], input[type="number"] {
            width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.08);
            background: var(--bg); color: var(--text); font-family: inherit; box-sizing: border-box; font-size: 14px;
        }
        textarea { height: 100px; resize: none; }

        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: #000; z-index: 100;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        body[data-theme='dark'] .loading-overlay { background: rgba(0,0,0,0.9); color: #fff; }

        .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(0,0,0,0.08);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin: 0 auto 12px auto;
        }
        body[data-theme='dark'] .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .recipe-box {
            background: rgba(0,0,0,0.02); border: none;
            border-radius: var(--radius-sm); padding: 14px; margin-bottom: 15px;
            font-size: 12px; color: var(--text); min-height: 60px;
            line-height: 1.6;
        }

        #hiddenEngine { display: none; }
        #hiddenTraceBuffer, #vortexScanCanvas { display: none; }

    </style>
</head>

        // --- MATH HELPERS ---
        function distSq(p1, p2) { return (p1.x-p2.x)**2 + (p1.y-p2.y)**2; }
        function dist(p1, p2) { return Math.sqrt(distSq(p1, p2)); }

        // --- AI BUILDER ORCHESTRATION ---
        function autoCenterAndScale(img, targetSize = 800) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(img, 0, 0);
            const data = tCtx.getImageData(0, 0, img.width, img.height).data;

            let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
            let found = false;
            const threshold = 220; // content threshold

            for (let y = 0; y < img.height; y++) {
                for (let x = 0; x < img.width; x++) {
                    const idx = (y * img.width + x) * 4;
                    const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    if (brightness < threshold) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        found = true;
                    }
                }
            }

            if (!found) {
                return { x: 0, y: 0, scale: Math.min(targetSize/img.width, targetSize/img.height) * 0.9 };
            }

            const contentW = maxX - minX + 1;
            const contentH = maxY - minY + 1;
            const contentCX = minX + contentW / 2;
            const contentCY = minY + contentH / 2;

            const offsetX = (img.width / 2) - contentCX;
            const offsetY = (img.height / 2) - contentCY;

            const scale = Math.min(targetSize / contentW, targetSize / contentH) * 0.98;

            return {
                x: offsetX * scale,
                y: offsetY * scale,
                scale: scale
            };
        }

        let lastPostScale = 1.0;
        let originalPointsForScale = null;

        function applyPostScale(val) {
            const factor = val / lastPostScale;
            lastPostScale = val;
            
            if (activeEffectType === 'loop' && loopSourcePath) {
                loopSourcePath.forEach(p => { if(p.type === 'point') { p.x *= factor; p.y *= factor; } });
                generateLoop();
            } else if (activeEffectType === 'sandify' && vortexSourcePath) {
                vortexSourcePath.forEach(p => { if(p.type === 'point') { p.x *= factor; p.y *= factor; } });
                scanVortexShape(); generateVortex();
            } else {
                rawPoints.forEach(p => { if(p.type === 'point') { p.x *= factor; p.y *= factor; } });
                render();
            }
        }

        function applyPostContrast(val) {
            document.getElementById('traceThreshInput').value = val;

        function runAIImage(prompt) {
            return new Promise((resolve, reject) => {
                document.getElementById('recipeDisplay').innerHTML = `<div class="spinner"></div> <b>Dreaming up:</b><br>"${prompt}"<br><i>Waiting for AI Image Generation...</i>`;
                
                // Enhanced prompt engineering specifically tailored for sand table vector tracing
                const aiQuery = `${prompt}, simple minimalist black and white vector clip art, clean dark continuous lines, stark white background, solid black line art, high contrast, no shading, no grayscale, no color, outline drawing, vector icon`;
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(aiQuery)}?width=800&height=800&nologo=true&enhance=true&seed=${Math.floor(Math.random()*100000)}`;
                
                const img = new Image();
                img.crossOrigin = "Anonymous";
                
                img.onload = function() {
                    const sparklesIcon = `<svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:currentColor; vertical-align:middle; display:inline-block; margin-right:4px;"><path d="M12,15.41L12.58,15L12,14.59L11.41,15L12,15.41M12,21L13.1,18.9L15.2,17.8L13.1,16.7L12,14.6L10.9,16.7L8.8,17.8L10.9,18.9L12,21M18,13L19.1,10.9L21.2,9.8L19.1,8.7L18,6.6L16.9,8.7L14.8,9.8L16.9,10.9L18,13M9,13L10.1,10.9L12.2,9.8L10.1,8.7L9,6.6L7.9,8.7L5.8,9.8L7.9,10.9L9,13Z"/></svg>`;
                    document.getElementById('recipeDisplay').innerHTML = `${sparklesIcon} <b>Processing:</b><br>"${prompt}"<br><i>Calculating Detail Contours...</i>`;
                    
                    setTimeout(() => {
                        const transform = autoCenterAndScale(img, 800);
                        traceState.active = true;
                        traceState.img = img;
                        traceState.x = transform.x; 
                        traceState.y = transform.y;
                        traceState.rotation = 0;

                        commitTraceMove();

                        showPostGenSlider('contrast');

                    }, 50);
                };

                img.onerror = function() {
                    document.getElementById('recipeDisplay').innerHTML = `<b>Error:</b> Failed to connect to AI generation server. Try again.`;
                    reject();
                }
                img.src = imgUrl;
            });
        }

        function doRandomDesign() {
            clearCanvas();
            const shapes = [
                'lissajous', 'hypotrochoid', 'rose', 'superformula', 
                'fermat_spiral', 'butterfly', 'epicycloid', 'organic',
                'star', 'hexagon', 'pentagon'
            ];
            const baseShape = shapes[Math.floor(Math.random() * shapes.length)];
            let equationName = "";

            if (baseShape === 'organic') {
                rawPoints = generateOrganicShape();
                equationName = "Organic Deformed Circle";
            } else if (baseShape === 'lissajous') {
                rawPoints = generateLissajous();
                equationName = "Lissajous Harmonic Curve: x=A·sin(a·t+δ), y=B·sin(b·t)";
            } else if (baseShape === 'hypotrochoid') {
                rawPoints = generateHypotrochoid();
                equationName = "Hypotrochoid Spirograph: x=(R-r)cos t + d·cos((R-r)t/r)";
            } else if (baseShape === 'rose') {
                rawPoints = generateRoseCurve();
                equationName = "Rhodonea Rose Curve: r = a·cos(k·θ)";
            } else if (baseShape === 'superformula') {
                rawPoints = generateSuperformula();
                equationName = "Gielis Superformula: r(φ) = [|cos(mφ/4)/a|^n2 + |sin(mφ/4)/b|^n3]^(-1/n1)";
            } else if (baseShape === 'fermat_spiral') {
                rawPoints = generateFermatSpiral();
                equationName = "Fermat Parabolic Spiral: r² = a²·θ";
            } else if (baseShape === 'butterfly') {
                rawPoints = generateButterflyCurve();
                equationName = "Fay's Butterfly Curve: r = e^sin(θ) - 2cos(4θ) + sin⁵((2θ-π)/24)";
            } else if (baseShape === 'epicycloid') {
                rawPoints = generateEpicycloid();
                equationName = "Epicycloid Cardioid: x=(R+r)cos t - r·cos((R+r)t/r)";
            } else {
                addShape(baseShape);
                equationName = baseShape.charAt(0).toUpperCase() + baseShape.slice(1);
            }

            const dx = (Math.random() - 0.5) * 60;
            const dy = (Math.random() - 0.5) * 60;
            const scaleFac = 0.6 + Math.random() * 0.8; 
            rawPoints.forEach(p => { if (p.type === 'point') { p.x = p.x * scaleFac + dx; p.y = p.y * scaleFac + dy; } });

            const effects = ['loop', 'sandify', 'none'];
            const effect = effects[Math.floor(Math.random() * effects.length)];

                activeEffectType = 'loop';

                document.getElementById('loopStretchMode').checked = stretch;
                recipeHTML += `<b>Filter:</b> Continuous Loop Orbit<br><b>Guide Path:</b> ${guide}<br><b>Iterations:</b> ${iters}<br><b>Angle:</b> ${ang}° | <b>Spin:</b> ${spin}°`;
                generateLoop();
            } else if (effect === 'sandify') {
                activeEffectType = 'sandify';
                currentTool = 'sandify';
                vortexSourcePath = JSON.parse(JSON.stringify(rawPoints));
                document.getElementById('vortexShape').value = 'custom';
                const swirl = Math.floor(Math.random() * 35) + 5;
                const zoom = (Math.random() * 2.0 + 3.0).toFixed(2);
                const twist = Math.floor(Math.random() * 60) - 30;
                document.getElementById('vortexSwirl').value = swirl;
                document.getElementById('vortexScale').value = zoom;
                document.getElementById('vortexTwist').value = twist;
                recipeHTML += `<b>Filter:</b> Vortex Spiral<br><b>Swirls:</b> ${swirl}<br><b>Twist Offset:</b> ${twist}°`;
                scanVortexShape();
                generateVortex();
            } else {
                activeEffectType = null;

                render();
            }
            document.getElementById('recipeDisplay').innerHTML = recipeHTML;
            showPostGenSlider('scale');
        }

        // --- MATH EQUATION GENERATORS ---
        function generateLissajous() {
            const pts = [];
            const a = Math.floor(Math.random() * 7) + 1;
            const b = Math.floor(Math.random() * 7) + 1;
            const delta = Math.random() * Math.PI;
            const R = 75;
            for (let i = 0; i <= 360; i++) {
                const t = (i / 360) * Math.PI * 2;
                const x = R * Math.sin(a * t + delta);
                const y = R * Math.sin(b * t);
                pts.push({ x, y, type: 'point', source: 'draw' });
            }
            pts.push({ type: 'break' });
            return pts;
        }

        function generateHypotrochoid() {
            const pts = [];
            const R = 90;
            const r = (Math.floor(Math.random() * 5) + 2) * 10;
            const d = (Math.floor(Math.random() * 5) + 1) * 12;
            const steps = 720;
            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * Math.PI * 8;
                const x = (R - r) * Math.cos(t) + d * Math.cos(((R - r) * t) / r);
                const y = (R - r) * Math.sin(t) - d * Math.sin(((R - r) * t) / r);
                pts.push({ x: x * 0.7, y: y * 0.7, type: 'point', source: 'draw' });
            }
            pts.push({ type: 'break' });
            return pts;
        }

        function generateRoseCurve() {
            const pts = [];
            const k = Math.floor(Math.random() * 8) + 2;
            const a = 75;
            const steps = (k % 2 === 0) ? 720 : 360;
            for (let i = 0; i <= steps; i++) {
                const theta = (i / 360) * Math.PI * 2;
                const r = a * Math.cos(k * theta);
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                pts.push({ x, y, type: 'point', source: 'draw' });
            }
            pts.push({ type: 'break' });
            return pts;
        }

        function generateSuperformula() {
            const pts = [];
            const a = 1, b = 1;
            const m = Math.floor(Math.random() * 10) + 2;
            const n1 = Math.random() * 2 + 0.2;
            const n2 = Math.random() * 4 + 0.5;
            const n3 = Math.random() * 4 + 0.5;
            const R = 70;

            for (let i = 0; i <= 360; i++) {
                const phi = (i / 360) * Math.PI * 2;
                const t1 = Math.pow(Math.abs(Math.cos(m * phi / 4) / a), n2);
                const t2 = Math.pow(Math.abs(Math.sin(m * phi / 4) / b), n3);
                const r = Math.pow(t1 + t2, -1 / n1);
                const x = R * r * Math.cos(phi);
                const y = R * r * Math.sin(phi);
                if (!isNaN(x) && !isNaN(y)) pts.push({ x, y, type: 'point', source: 'draw' });
            }
            pts.push({ type: 'break' });
            return pts;
        }

        function generateFermatSpiral() {
            const pts = [];
            const a = 8;
            const turns = Math.floor(Math.random() * 4) + 3;
            const totalSteps = turns * 180;
            for (let i = 1; i <= totalSteps; i++) {
                const theta = (i / 180) * Math.PI * 2;
                const r = a * Math.sqrt(theta);
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                pts.push({ x, y, type: 'point', source: 'draw' });
            }
            pts.push({ type: 'break' });
            return pts;
        }

        function generateButterflyCurve() {
            const pts = [];
            const steps = 720;
            for (let i = 0; i <= steps; i++) {
                const theta = (i / steps) * Math.PI * 12;
                const r = 16 * (Math.exp(Math.sin(theta)) - 2 * Math.cos(4 * theta) + Math.pow(Math.sin((2 * theta - Math.PI) / 24), 5));
                const x = r * Math.cos(theta);
                const y = r * Math.sin(theta);
                pts.push({ x, y, type: 'point', source: 'draw' });
            }
            pts.push({ type: 'break' });
            return pts;
        }

        function generateEpicycloid() {
            const pts = [];
            const R = 60;
            const k = Math.floor(Math.random() * 5) + 2;
            const r = R / k;
            const steps = 360;
            for (let i = 0; i <= steps; i++) {
                const t = (i / steps) * Math.PI * 2;
                const x = (R + r) * Math.cos(t) - r * Math.cos(((R + r) * t) / r);
                const y = (R + r) * Math.sin(t) - r * Math.sin(((R + r) * t) / r);
                pts.push({ x: x * 0.9, y: y * 0.9, type: 'point', source: 'draw' });
            }
            pts.push({ type: 'break' });
            return pts;
        }

        function generateOrganicShape() {
            const pts = [];
            const rBase = 40 + Math.random() * 40;
            const bumps = Math.floor(Math.random() * 6) + 2; 
            const bumpiness = Math.random() * 25 + 5;
            for(let i=0; i<=100; i++) {
                const a = (i/100) * Math.PI * 2;
                const r = rBase + Math.sin(a * bumps) * bumpiness;
                pts.push({x: Math.cos(a)*r, y: Math.sin(a)*r, type: 'point', source: 'draw'}); 
            }
            pts.push({type: 'break'});
            return pts;
        }

        let dragStart = null;
        function startDraw(e) { e.preventDefault(); if(generatedGCode) return; isDrawing = true; dragStart = getPos(e); canvas.setPointerCapture(e.pointerId); }
        function moveDraw(e) {
            e.preventDefault();
            const pos = getPos(e);
            document.getElementById('coordDisplay').textContent = `X:${pos.x.toFixed(0)} Y:${pos.y.toFixed(0)}`;
            if(isDrawing && dragStart) {
                const dx = pos.x - dragStart.x; const dy = pos.y - dragStart.y;
                if (activeEffectType === 'loop' && loopSourcePath) {
                    loopPathOffset.x += dx; loopPathOffset.y += dy; generateLoop();
                } else if (activeEffectType === 'sandify' && vortexSourcePath) {
                    vortexSourcePath.forEach(p => { if(p.type === 'point') { p.x += dx; p.y += dy; } });
                    scanVortexShape(); generateVortex();
                } else {
                    rawPoints.forEach(p => { if(p.type === 'point') { p.x += dx; p.y += dy; } });
                }
                dragStart = pos; render();
            }
        }
        function endDraw(e) { if(!isDrawing) return; isDrawing = false; canvas.releasePointerCapture(e.pointerId); dragStart = null; saveState(); }

        function addShape(type) {
            const r = 50; let pts = [];
            if(type==='circle') { for(let i=0; i<=36; i++) { const a = (i/36)*Math.PI*2; pts.push({x: Math.cos(a)*r, y: Math.sin(a)*r}); } } 
            else if(type==='square') { pts = [{x:-r,y:-r}, {x:r,y:-r}, {x:r,y:r}, {x:-r,y:r}, {x:-r,y:-r}]; } 
            else if(type==='triangle') { pts = [{x:0,y:r}, {x:r*0.86,y:-r/2}, {x:-r*0.86,y:-r/2}, {x:0,y:r}]; } 
            else if(type==='hexagon') { for(let i=0; i<=6; i++) { const a = (i/6)*Math.PI*2; pts.push({x: Math.cos(a)*r, y: Math.sin(a)*r}); } } 
            else if(type==='pentagon') { for(let i=0; i<=5; i++) { const a = (i/5)*Math.PI*2 - Math.PI/2; pts.push({x: Math.cos(a)*r, y: Math.sin(a)*r}); } } 
            else if(type==='star') { for(let i=0; i<=10; i++) { const a = (i/10)*Math.PI*2 + Math.PI/2; const rad = (i%2===0) ? r : r*0.4; pts.push({x: Math.cos(a)*rad, y: Math.sin(a)*rad}); } } 
            else if(type==='spiral') { for(let i=0; i<100; i++) { const a = i * 0.3; const rad = (i/100)*r; pts.push({x: Math.cos(a)*rad, y: Math.sin(a)*rad}); } } 
            rawPoints = []; pts.forEach(p => rawPoints.push({x:p.x, y:p.y, type:'point', source: 'draw'})); rawPoints.push({type:'break'}); 
        }

        function getPos(e) { return { x: (e.offsetX - origin.x) / scale, y: -(e.offsetY - origin.y) / scale }; }

        function scanVortexShape() {
            const scanCanvas = document.getElementById('vortexScanCanvas'); const scanCtx = scanCanvas.getContext('2d');
            const w = scanCanvas.width; const h = scanCanvas.height; const cx = w/2; const cy = h/2; const r = w/2 - 20;
            const type = document.getElementById('vortexShape').value; const txt = document.getElementById('vortexChar').value;

            scanCtx.fillStyle = '#000'; scanCtx.fillRect(0, 0, w, h); scanCtx.fillStyle = '#fff'; scanCtx.strokeStyle = '#fff';
            scanCtx.lineWidth = 15; scanCtx.textAlign = 'center'; scanCtx.textBaseline = 'middle';
            scanCtx.save(); scanCtx.beginPath();

            const drawPoly = (sides) => { const offset = -Math.PI / 2; scanCtx.moveTo(cx + r * Math.cos(offset), cy + r * Math.sin(offset)); for (let i = 1; i <= sides; i++) { scanCtx.lineTo(cx + r * Math.cos(offset + i * 2 * Math.PI / sides), cy + r * Math.sin(offset + i * 2 * Math.PI / sides)); } };
            const drawStar = (pts) => { let rot = Math.PI / 2 * 3; let step = Math.PI / pts; scanCtx.moveTo(cx, cy - r); for (let i = 0; i < pts; i++) { scanCtx.lineTo(cx + Math.cos(rot) * r, cy + Math.sin(rot) * r); rot += step; scanCtx.lineTo(cx + Math.cos(rot) * (r*0.4), cy + Math.sin(rot) * (r*0.4)); rot += step; } scanCtx.lineTo(cx, cy - r); };

            if (type === 'custom') {
                const tableR = parseFloat(document.getElementById('cfgRadius').value); 
                const scaleToFit = r / tableR; 
                
                // Centering Logic for Custom Shape
                let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
                vortexSourcePath.forEach(p => { if(p.type === 'point') { minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); } });
                const scx = (minX + maxX) / 2; const scy = (minY + maxY) / 2;

                scanCtx.beginPath(); 
                vortexSourcePath.forEach((p, i) => { 
                    if(p.type === 'break' || p.type === 'cmd') return; 
                    const sx = cx + ((p.x - scx) * scaleToFit); 
                    const sy = cy - ((p.y - scy) * scaleToFit); 
                    if(i===0 || vortexSourcePath[i-1].type === 'break') scanCtx.moveTo(sx, sy); else scanCtx.lineTo(sx, sy); 
                }); 
                scanCtx.stroke();
            } else if (type === 'triangle') drawPoly(3);
            else if (type === 'square') drawPoly(4);
            else if (type === 'pentagon') drawPoly(5);
            else if (type === 'hexagon') drawPoly(6);
            else if (type === 'star') drawStar(5);
            else if (type === 'text') { scanCtx.font = 'bold 450px Arial'; scanCtx.fillText(txt, cx, cy + 30); }

            scanCtx.stroke(); scanCtx.fill(); scanCtx.restore();
            const pixels = scanCtx.getImageData(0, 0, w, h).data; const steps = 3600;
            for (let i = 0; i < steps; i++) { let maxDist = 0; const angle = (i / steps) * Math.PI * 2; const cos = Math.cos(angle); const sin = Math.sin(angle); for (let dist = 0; dist < r; dist += 2) { const x = Math.floor(cx + cos * dist); const y = Math.floor(cy + sin * dist); const idx = (y * w + x) * 4; if (pixels[idx] > 100) maxDist = dist; } vortexState.radiusMap[i] = maxDist / r; }
        }

        function generateVortex() {
            const swirlCount = parseInt(document.getElementById('vortexSwirl').value); const scaleFac = parseFloat(document.getElementById('vortexScale').value) * 0.85;
            const twistDeg = parseFloat(document.getElementById('vortexTwist').value); const tableRadius = parseFloat(document.getElementById('cfgRadius').value);
            const iterations = 8000; const centerGap = 4; const newPoints = []; newPoints.push({type:'break'});
            
            for (let i = 0; i <= iterations; i++) {
                const t = i / iterations; // Single arm from 0 to 1
                const spiralAngle = t * swirlCount * Math.PI * 2;
                const twistRad = (twistDeg * (Math.PI/180)) * swirlCount * t;
                let lookupAngle = spiralAngle + twistRad; 
                let normAngle = lookupAngle % (Math.PI * 2); if (normAngle < 0) normAngle += Math.PI * 2;
                const mapIdx = Math.floor((normAngle / (Math.PI * 2)) * 3600) % 3600;
                
                let shapeFactor = vortexState.radiusMap[mapIdx]; 
                if(shapeFactor < 0.05) shapeFactor = 0.05; 
                
                const maxR = tableRadius * scaleFac; 
                const r = (centerGap + (t * (maxR - centerGap))) * shapeFactor;
                
                const x = r * Math.cos(spiralAngle); 
                const y = r * Math.sin(spiralAngle);
                newPoints.push({x: x, y: y, type:'point'});
            }
            newPoints.push({type:'break'}); rawPoints = newPoints; render();
        }

        function getLoopPathPoint(t) {
            let pathType = document.getElementById('loopGuidePath').value;
            if (pathType === 'circle') { return { x: 75 * Math.cos(t * Math.PI * 2), y: 75 * Math.sin(t * Math.PI * 2) }; } 
            else if (pathType === 'square') { let d = (t % 1) * 4; let side = Math.floor(d); let frac = d - side; let x, y; if (side === 0) { x = -75 + 150 * frac; y = -75; } else if (side === 1) { x = 75; y = -75 + 150 * frac; } else if (side === 2) { x = 75 - 150 * frac; y = 75; } else { x = -75; y = 75 - 150 * frac; } return { x, y }; } 
            else if (pathType === 'figure8') { let ang = t * Math.PI * 2; return { x: 100 * Math.sin(ang), y: 100 * Math.sin(ang) * Math.cos(ang) }; }
            return {x:0, y:0};
        }

        function generateLoop() {
            const iterations = parseInt(document.getElementById('loopIter').value);
            const angleStepDeg = parseFloat(document.getElementById('loopAngle').value);
            const spinStepDeg = parseFloat(document.getElementById('loopSpin').value);
            const scaleFac = parseFloat(document.getElementById('loopScale').value);
            const oscRate = parseFloat(document.getElementById('loopOsc').value);
            const stretchMode = document.getElementById('loopStretchMode').checked;
            let newPoints = []; newPoints.push({type: 'break'});
            const pointsOnly = loopSourcePath.filter(p => p.type === 'point');
            const numPts = pointsOnly.length; if(numPts === 0) return;
            let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
            pointsOnly.forEach(p => { minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
            let cx = (minX+maxX)/2; let cy = (minY+maxY)/2;
            for(let i=0; i<iterations; i++) {
                let ptIdx = 0;
                loopSourcePath.forEach((p, idx) => {
                    if(p.type === 'break' || p.type === 'cmd') { if (!stretchMode) { if (idx !== 0 && idx !== loopSourcePath.length - 1) { newPoints.push({...p}); } } } 
                    else {
                        let shapeProgress = stretchMode ? (numPts > 1 ? ptIdx / (numPts - 1) : 0) : 0;
                        let effectiveIter = i + shapeProgress;
                        const currentAngle = effectiveIter * angleStepDeg * (Math.PI / 180);
                        const currentSpin = effectiveIter * spinStepDeg * (Math.PI / 180);
                        let oscScale = 1.0; if (oscRate > 0) { const freq = oscRate * 0.1; oscScale = 1.0 + 0.4 * Math.sin(effectiveIter * freq); }
                        const currentScale = scaleFac * oscScale * 0.75;
                        let dx = p.x - cx; let dy = p.y - cy;
                        let spun_x = cx + dx * Math.cos(currentSpin) - dy * Math.sin(currentSpin);
                        let spun_y = cy + dx * Math.sin(currentSpin) + dy * Math.cos(currentSpin);
                        let sx = spun_x * currentScale; let sy = spun_y * currentScale;
                        let rx = sx * Math.cos(currentAngle) - sy * Math.sin(currentAngle);
                        let ry = sx * Math.sin(currentAngle) + sy * Math.cos(currentAngle);
                        let pathT = effectiveIter / iterations; let pathPt = getLoopPathPoint(pathT);
                        newPoints.push({x: rx + pathPt.x + loopPathOffset.x, y: ry + pathPt.y + loopPathOffset.y, type: 'point'});
                        ptIdx++;
                    }
                });
                if (!stretchMode && i < iterations - 1) { newPoints.push({type: 'break'}); }
            }
            newPoints.push({type: 'break'}); rawPoints = newPoints; render();
        }

        function calculateSpiralTrace(imgData, thresh, density, ballSizeMm, tableR) {
            const pixelBallSize = (ballSizeMm / (tableR * 2)) * 800;
            const SIZE = 800; const CENTER = SIZE / 2;
            let pixelGrid = new Uint8Array(SIZE*SIZE); for(let i=0; i<SIZE*SIZE; i++) { pixelGrid[i] = imgData.data[i*4] < thresh ? 1 : 0; }
            let contours = []; const traced = new Uint8Array(SIZE*SIZE).fill(0);
            const traceBoundary = (sx, sy) => {
                const path = []; let cx = sx, cy = sy; let bx = sx-1, by = sy; let max = SIZE*10; let lastAddedX = -10, lastAddedY = -10;
                do {
                    if (Math.hypot(cx - lastAddedX, cy - lastAddedY) > 1.5) { path.push({x:cx, y:cy}); lastAddedX = cx; lastAddedY = cy; }
                    traced[cy*SIZE+cx] = 1;
                    const n = [{x:-1,y:0},{x:-1,y:-1},{x:0,y:-1},{x:1,y:-1},{x:1,y:0},{x:1,y:1},{x:0,y:1},{x:-1,y:1}];
                    let startIdx = 0; for(let i=0; i<8; i++) if(bx===cx+n[i].x && by===cy+n[i].y) startIdx=(i+1)%8;
                    let found = false;
                    for(let i=0; i<8; i++) { const idx = (startIdx + i)%8; const nx = cx + n[idx].x; const ny = cy + n[idx].y; if(nx>=0 && nx<SIZE && ny>=0 && ny<SIZE && pixelGrid[ny*SIZE+nx]===1) { bx=cx; by=cy; cx=nx; cy=ny; found=true; break; } else { bx=nx; by=ny; } }
                    if(!found) break; max--;
                } while((cx!==sx || cy!==sy) && max>0);
                return path;
            };
            for(let y=1; y<SIZE-1; y++) { for(let x=1; x<SIZE-1; x++) { const idx = y*SIZE + x; if(pixelGrid[idx] === 1 && pixelGrid[idx-1] === 0 && traced[idx] === 0) { const pth = traceBoundary(x, y); if(pth.length > 40) { let maxDist = 0; let bestIdx = 0; pth.forEach((p, i) => { const dist = Math.hypot(p.x - CENTER, p.y - CENTER); if(dist > maxDist) { maxDist = dist; bestIdx = i; } }); const reordered = [...pth.slice(bestIdx), ...pth.slice(0, bestIdx)]; reordered.push(reordered[0]); contours.push({ points: reordered, trigger: reordered[0], maxR: maxDist, merged: false }); } } } }
            contours.sort((a, b) => a.maxR - b.maxR);
            let spiral = []; const maxR = SIZE/2 - 5; spiral.push({x: CENTER, y: CENTER});
            let angle = 0; let r = 0; const angleStep = 0.02; const spacingPx = density * 4.0; 
            while(r < maxR) { 
                r = (spacingPx / (2*Math.PI)) * angle; let x = CENTER + Math.cos(angle)*r; let y = CENTER + Math.sin(angle)*r; 
                let wiggle = 0; const ix = Math.floor(x), iy = Math.floor(y); if(ix>=0 && ix<SIZE && iy>=0 && iy<SIZE) { if(pixelGrid[iy*SIZE+ix] === 1) wiggle = Math.sin(angle * 30) * (spacingPx * 0.2); } 
                x += Math.cos(angle) * wiggle; y += Math.sin(angle) * wiggle; const sp = {x:x, y:y}; spiral.push(sp); 
                const spiralRadius = Math.hypot(sp.x - CENTER, sp.y - CENTER);
                for (let c of contours) { if(!c.merged) { if (spiralRadius > (c.maxR + (pixelBallSize * 0.4))) { const contourAngle = Math.atan2(c.trigger.y - CENTER, c.trigger.x - CENTER); let normAngle = Math.atan2(Math.sin(angle), Math.cos(angle)); if (Math.abs(normAngle - contourAngle) < 0.05) { spiral.push(c.trigger); c.points.forEach(p => spiral.push(p)); spiral.push(c.trigger); spiral.push(sp); c.merged = true; } } } }
                angle += angleStep; 
            }
            const scaleFac = (tableR * 2) / SIZE; let finalPoints = []; spiral.forEach(p => { let tx = (p.x - 400) * scaleFac; let ty = (400 - p.y) * scaleFac; finalPoints.push({ x: tx, y: ty, type: 'point' }); });
            return finalPoints;
        }

        function rasterizeCanvasForTrace() {
            const size = 800; const buff = document.getElementById('hiddenTraceBuffer'); const bCtx = buff.getContext('2d');
            bCtx.fillStyle = "white"; bCtx.fillRect(0, 0, size, size); bCtx.strokeStyle = "black";
            const tableR = parseFloat(document.getElementById('cfgRadius').value);
            const ballSizeMm = parseFloat(document.getElementById('cfgBallSize').value);
            bCtx.lineWidth = (ballSizeMm / (tableR * 2)) * size; bCtx.lineCap = "round"; bCtx.lineJoin = "round";
            bCtx.save(); bCtx.translate(size/2, size/2);
            const scaleFac = (size / 2) / tableR;
            let shapes = []; let curShape = []; rawPoints.forEach(p => { if(p.type === 'break' || p.type === 'cmd') { if(curShape.length > 0) shapes.push(curShape); curShape = []; } else curShape.push(p); });
            if(curShape.length > 0) shapes.push(curShape);
            bCtx.beginPath(); shapes.forEach(sh => { if (sh.length > 0) { bCtx.moveTo(sh[0].x * scaleFac, -sh[0].y * scaleFac); for(let i=1; i<sh.length; i++) { bCtx.lineTo(sh[i].x * scaleFac, -sh[i].y * scaleFac); } } });
            bCtx.stroke(); bCtx.restore();
            return bCtx.getImageData(0,0,size,size);
        }

        function commitTraceMove() {
            const size = 800; const buff = document.getElementById('hiddenTraceBuffer'); const bCtx = buff.getContext('2d');
            bCtx.fillStyle = "white"; bCtx.fillRect(0, 0, size, size); bCtx.save(); bCtx.translate(size/2, size/2);
            bCtx.translate(traceState.x, traceState.y); bCtx.rotate(traceState.rotation * Math.PI / 180);
            const drawW = traceState.img.width * traceState.scale; const drawH = traceState.img.height * traceState.scale;
            bCtx.drawImage(traceState.img, -drawW/2, -drawH/2, drawW, drawH); bCtx.restore();
            traceImgData = bCtx.getImageData(0,0,size,size); 
            const thresh = parseInt(document.getElementById('traceThreshInput').value); 
            const density = parseFloat(document.getElementById('traceDensityInput').value); 
            const ballSizeMm = parseFloat(document.getElementById('cfgBallSize').value);
            const tableR = parseFloat(document.getElementById('cfgRadius').value);
            const generated = calculateSpiralTrace(traceImgData, thresh, density, ballSizeMm, tableR);
            rawPoints = []; if(generated.length > 0) rawPoints.push({type:'break'}); rawPoints = rawPoints.concat(generated); if(generated.length > 0) rawPoints.push({type:'break'}); render();
        }

        function resizeCanvas() {
            const container = document.getElementById('canvasContainer'); const size = container.getBoundingClientRect().width; const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr; canvas.height = size * dpr; ctx.scale(dpr, dpr); origin = { x: size/2, y: size/2 };
            const tableR = parseFloat(document.getElementById('cfgRadius').value); scale = (size/2) / (tableR * 1.05); render();
        }
        function saveState() { if(historyStack.length>10) historyStack.shift(); historyStack.push(JSON.stringify(rawPoints)); }
        function undo() { if(historyStack.length===0) return; rawPoints = JSON.parse(historyStack.pop()); render(); }
        function clearCanvas() { saveState(); rawPoints = []; traceState.active=false; render(); }
        function updateUI() { const symEl = document.getElementById('symVal'); if (symEl) symEl.textContent = document.getElementById('symSlider').value + 'x'; render(); }
        function showToast(msg, type) { const t = document.getElementById('status-toast'); t.textContent = msg; t.className = type; t.style.opacity = 1; setTimeout(()=>t.style.opacity=0, 3000); }
        function toggleTheme() { const b = document.body; b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark'?'light':'dark'); render(); }
        function resetStatus() { generatedGCode = null; processedPoints = []; document.getElementById('progressSlider').value = 100; render(); }
        
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            const navMap = {
                '/': 'nav-designs',
                '/controller': 'nav-controller',
                '/sketch': 'nav-sketch',
                '/AI_builder': 'nav-ai',
                '/led_controls': 'nav-leds',
                '/terminal': 'nav-terminal',
                '/settings': 'nav-settings'
            };
            
            // Remove active from all first
            document.querySelectorAll('.main-nav a').forEach(a => a.classList.remove('active'));
            
            let activeId = navMap[path];
            
            // Smart fallback
            if (!activeId) {
                for (const key in navMap) {
                    if (key !== '/' && path.includes(key)) {
                        activeId = navMap[key];
                        break;
                    }
                }
            }

            if (!activeId && (path === '/' || path === '')) {
                activeId = 'nav-designs';
            } else if (!activeId && path.includes('AI_builder')) {
                activeId = 'nav-ai';
            }

            const el = document.getElementById(activeId);
            if (el) el.classList.add('active');
            init();
        });

        function render() {
            const w = canvas.width / window.devicePixelRatio; const h = canvas.height / window.devicePixelRatio; ctx.clearRect(0, 0, w, h);
            const tableR = parseFloat(document.getElementById('cfgRadius').value); const sym = parseInt(document.getElementById('symSlider').value); const dark = document.body.getAttribute('data-theme') === 'dark'; const prog = parseInt(document.getElementById('progressSlider').value); document.getElementById('progVal').textContent = prog + '%';
            ctx.save(); ctx.translate(origin.x, origin.y); ctx.beginPath(); ctx.arc(0, 0, tableR*scale, 0, Math.PI*2); ctx.strokeStyle = dark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)'; ctx.lineWidth = 2; ctx.stroke();
            
            const showingFinal = (processedPoints.length > 0);
            if (showingFinal) {
                ctx.lineWidth = 0.1;
                ctx.strokeStyle = dark ? 'rgba(161, 196, 253, 0.4)' : 'rgba(0, 123, 255, 0.3)';
                for(let s=0; s<sym; s++) {
                    const ang = s * (Math.PI*2/sym); ctx.save(); ctx.rotate(ang); ctx.beginPath();
                    let isMove = true;
                    for(let i=0; i<rawPoints.length; i++) {
                        const p = rawPoints[i];
                        if(p.type === 'break' || p.type === 'cmd') { isMove = true; continue; }
                        const px = p.x * scale, py = -p.y * scale;
                        if(isMove) { ctx.moveTo(px, py); isMove = false; } else ctx.lineTo(px, py);
                    }
                    ctx.stroke(); ctx.restore();
                }
            }

            const dataToShow = showingFinal ? processedPoints : rawPoints, limit = Math.floor(dataToShow.length * (prog/100)), color = showingFinal ? '#ff0000' : (dark ? '#a1c4fd' : '#007bff'); ctx.lineWidth = showingFinal ? 1 : 1.5; const loopCount = showingFinal ? 1 : sym;
            for(let s=0; s<loopCount; s++) { const ang = s * (Math.PI*2/sym); ctx.save(); if(!showingFinal) ctx.rotate(ang); ctx.beginPath(); ctx.strokeStyle = color; let isMove = true; for(let i=0; i<limit; i++) { const p = dataToShow[i]; if(p.type === 'break' || p.type === 'cmd') { isMove = true; continue; } const px = p.x * scale, py = -p.y * scale; if(isMove) { ctx.moveTo(px, py); isMove = false; } else ctx.lineTo(px, py); } ctx.stroke(); ctx.restore(); }
            ctx.restore();
        }

        async function sendToTable() { if(!generatedGCode) return showToast("Click Compile Path first", "error"); fetch(BASE_URL+'/send_gcode_block', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({gcode:generatedGCode, filename:'ai_export.txt'}) }).then(r => r.json()).then(d => showToast(d.success ? "Sent!" : "Error", d.success ? "success" : "error")); }
        async function saveToServer() { if(!generatedGCode) return showToast("Compile Path first!", "error"); let n = prompt("Enter filename:"); if(n) { if(!n.toLowerCase().endsWith('.txt')) n += ".txt"; fetch(BASE_URL+'/save_design', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({filename:n, gcode:generatedGCode}) }).then(r => r.json()).then(d => showToast(d.success ? "Saved!" : "Failed", d.success ? "success" : "error")); } }
        
        function prepareGCode() {
            if(rawPoints.length === 0) return showToast("Generate something first!", "error");
            const tableR = parseFloat(document.getElementById('cfgRadius').value), sym = parseInt(document.getElementById('symSlider').value);
            let shapes = [], curShape = []; rawPoints.forEach(p => { if(p.type === 'break' || p.type === 'cmd') { if(curShape.length > 0) shapes.push(curShape); curShape = []; } else curShape.push(p); }); if(curShape.length > 0) shapes.push(curShape);
            
            if (document.getElementById('spiralConnectMode').checked) {
                const imgData = rasterizeCanvasForTrace(); processedPoints = calculateSpiralTrace(imgData, 150, 3.0, 13.0, tableR);
            } else {
                let pool = []; for(let s=0; s<sym; s++) { const ang = s * (Math.PI*2/sym), c = Math.cos(ang), si = Math.sin(ang); shapes.forEach(sh => pool.push(sh.map(p => ({ x: p.x*c - p.y*si, y: p.x*si + p.y*c, type: 'point' })))); }
                processedPoints = []; pool.forEach((sh, i) => { if(i > 0) processedPoints.push({x: sh[0].x, y: sh[0].y, type:'point'}); sh.forEach(p => processedPoints.push(p)); });
            }
            let currentTheta = 0;
            let lastRawTheta = 0;

            generatedGCode = processedPoints.map((p, i) => {
                if (p.type === 'cmd') return "";
                let rawTheta = Math.atan2(p.y, p.x);
                let rho = Math.hypot(p.x, p.y) / tableR;
                if (rho > 1.0) rho = 1.0; // Clamps points to the perimeter

                if (i > 0) {
                    let diff = rawTheta - lastRawTheta;
                    if (diff < -Math.PI) diff += Math.PI * 2;
                    if (diff > Math.PI) diff -= Math.PI * 2;
                    currentTheta += diff;
                } else {
                    currentTheta = rawTheta;
                }
                
                lastRawTheta = rawTheta;
                return `${currentTheta.toFixed(4)} ${rho.toFixed(4)}`;
            }).filter(l => l !== "").join('\n');
            document.getElementById('designPhaseControls').style.display = 'none'; document.getElementById('productionPhaseControls').style.display = 'block'; document.getElementById('simulationArea').style.display = 'block'; render();
        }
        
        function returnToEditing() { processedPoints = []; document.getElementById('designPhaseControls').style.display = 'block'; document.getElementById('productionPhaseControls').style.display = 'none'; document.getElementById('simulationArea').style.display = 'none'; resetStatus(); }
        function copyGCode() { if(generatedGCode) navigator.clipboard.writeText(generatedGCode).then(() => showToast("Copied!", "success")); }
